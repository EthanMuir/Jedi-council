# Addendum A3: heterogeneous seats, multi-provider routing.
#
# A Claude seat that *consults* GPT gives no diversity -- the final
# judgment is still Claude's. A seat that *is* GPT gives genuinely
# independent errors, because a different pretraining corpus and different
# RLHF produce different blind spots. Assign whole seats to whole models.
#
# This file is intentionally explicit about `provider` per seat, rather
# than inferring it from a model-name glob (the addendum's own
# `gpt-*`/`gemini-*` shorthand) -- fewer moving parts, and it fails loudly
# instead of silently mis-routing if a model name changes shape.
#
# Every non-Anthropic seat has a `fallback_provider`/`fallback_model`.
# council/engine/routing.py falls back automatically whenever the intended
# provider's API key isn't configured -- which, as of this build, is every
# provider except Anthropic. Add an OPENAI_API_KEY or GOOGLE_API_KEY to
# .env and the affected seats start routing for real, with no code changes.

providers:
  anthropic:
    tier: primary
  openai:
    tier: metered
  google:
    tier: free

seats:
  technician:          {provider: anthropic, model: claude-sonnet-5}
  fundamentalist:      {provider: openai,    model: gpt-5,       fallback_provider: anthropic, fallback_model: claude-sonnet-5}
  catalyst_seer:       {provider: anthropic, model: claude-sonnet-5}
  insider_reader:      {provider: anthropic, model: claude-sonnet-5}
  senate_watcher:      {provider: google,    model: gemini-3-pro, fallback_provider: anthropic, fallback_model: claude-sonnet-5}
  flow_cartographer:   {provider: anthropic, model: claude-sonnet-5}
  oracle_options:      {provider: anthropic, model: claude-sonnet-5}
  macro_sage:          {provider: google,    model: gemini-3-pro, fallback_provider: anthropic, fallback_model: claude-sonnet-5}
  cross_market:        {provider: anthropic, model: claude-sonnet-5}
  estimate_scribe:     {provider: openai,    model: gpt-5,       fallback_provider: anthropic, fallback_model: claude-sonnet-5}
  analyst_ratings:     {provider: openai,    model: gpt-5,       fallback_provider: anthropic, fallback_model: claude-sonnet-5}
  structure_archivist: {provider: anthropic, model: claude-sonnet-5}

  bull_advocate:  {provider: anthropic, model: claude-sonnet-5}
  bear_advocate:  {provider: openai,    model: gpt-5, fallback_provider: anthropic, fallback_model: claude-sonnet-5}
  prosecutor:     {provider: anthropic, model: claude-opus-5}
  grand_master:   {provider: anthropic, model: claude-opus-5}
