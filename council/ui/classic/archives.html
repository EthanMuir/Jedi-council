<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Ticker Council" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d1015" media="(prefers-color-scheme: dark)" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The High Council -- The Archives</title>
<link rel="stylesheet" href="/classic/css/theme.css" />
<link rel="stylesheet" href="/classic/css/archives.css" />
</head>
<body>

<div class="container">
  <h1 style="text-align:center; margin-bottom: 8px;">The Archives</h1>
  <p class="dim" style="text-align:center; margin-bottom: 16px;">Rank is gated on 20+ resolutions -- a lucky streak cannot mint a Master.</p>

  <div class="archives-mode">
    <div class="toggle-row" id="mode-toggle" role="group" aria-label="Which runs to score">
      <button class="toggle-option" data-mode="paid">Paid runs</button>
      <button class="toggle-option" data-mode="free">Free runs</button>
      <button class="toggle-option" data-mode="">All</button>
    </div>
    <div class="dim" id="mode-hint" style="font-size:12px; margin-top:8px;"></div>
  </div>

  <div class="panel table-scroll">
    <table class="archives-table mono" id="archives-table">
      <thead>
        <tr>
          <th>Rank</th><th>Seat</th><th>N</th><th>Hit Rate</th><th>Brier</th><th>Log Loss</th><th>Calibration</th>
        </tr>
      </thead>
      <tbody id="archives-tbody">
        <tr><td colspan="7" class="dim">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="/classic/js/common.js"></script>
<script src="/classic/js/archives.js"></script>
</body>
</html>
