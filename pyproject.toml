[project]
name = "council"
version = "0.1.0"
description = "The High Council -- data-isolated multi-agent market prediction system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "anyio>=4.4",
    "anthropic>=0.34",
    "openai>=1.50",
    "google-genai>=0.3",
    "pyyaml>=6.0",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["council*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["council/tests"]
